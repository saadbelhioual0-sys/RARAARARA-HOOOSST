<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Sign In - JAGWAR HOST</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100;14..32,200;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #1e3a5f;
            --primary-blue-light: #2c5282;
            --primary-blue-dark: #0f2b3d;
            --accent-blue: #3b82f6;
            --accent-blue-glow: rgba(59, 130, 246, 0.3);
            --dark-bg: #0a0a0a;
            --dark-card: #0f0f0f;
            --dark-border: #1f1f1f;
            --text-white: #ffffff;
            --text-gray: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gradient-primary: linear-gradient(135deg, #1e3a5f 0%, #3b82f6 100%);
            --gradient-secondary: linear-gradient(135deg, #0f2b3d 0%, #1e3a5f 100%);
            --shadow-glow: 0 0 30px rgba(59, 130, 246, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #0f0f1a 50%, #0a0a0a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.08), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(30, 58, 95, 0.08), transparent 50%);
            pointer-events: none;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            opacity: 0.05;
            animation: floatShape 20s infinite linear;
        }

        .shape-1 {
            top: 10%;
            left: 5%;
            width: 300px;
            height: 300px;
            background: var(--accent-blue);
            border-radius: 50%;
            filter: blur(80px);
            animation-duration: 25s;
        }

        .shape-2 {
            bottom: 10%;
            right: 5%;
            width: 250px;
            height: 250px;
            background: var(--primary-blue);
            border-radius: 50%;
            filter: blur(70px);
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .shape-3 {
            top: 50%;
            left: 50%;
            width: 400px;
            height: 400px;
            background: var(--accent-blue);
            border-radius: 50%;
            filter: blur(100px);
            transform: translate(-50%, -50%);
            animation-duration: 35s;
        }

        @keyframes floatShape {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        /* Login Container */
        .login-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 10;
            animation: slideUpFade 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Login Card */
        .login-card {
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), var(--shadow-glow);
            transition: all 0.4s ease;
        }

        .login-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(59, 130, 246, 0.15);
        }

        /* Header */
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: var(--gradient-primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            animation: logoGlow 2s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(59, 130, 246, 0);
            }
        }

        .logo-icon i {
            font-size: 2.5rem;
            color: white;
        }

        .login-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .login-header h2 span {
            color: var(--accent-blue);
        }

        .login-header p {
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        /* Error Message */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: var(--danger);
            font-size: 0.85rem;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .error-message i {
            font-size: 1.2rem;
        }

        /* Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 1.1rem;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--dark-border);
            border-radius: 14px;
            color: var(--text-white);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(10, 10, 10, 1);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-group input:focus + i {
            color: var(--accent-blue);
        }

        /* Options */
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.5rem 0;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .remember-me input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--accent-blue);
        }

        .forgot-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Login Button */
        .login-btn {
            background: var(--gradient-primary);
            border: none;
            border-radius: 14px;
            padding: 1rem;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--text-gray);
            font-size: 0.8rem;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--dark-border);
        }

        /* Demo Credentials */
        .demo-credentials {
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 14px;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        .demo-title {
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .demo-title i {
            color: var(--warning);
        }

        .credential-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            font-size: 0.85rem;
            border-bottom: 1px dashed var(--dark-border);
        }

        .credential-row:last-child {
            border-bottom: none;
        }

        .credential-label {
            color: var(--text-gray);
        }

        .credential-value {
            color: var(--accent-blue);
            font-family: monospace;
            font-weight: 600;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--dark-border);
            color: var(--text-gray);
            font-size: 0.75rem;
        }

        /* Responsive */
        @media (max-width: 560px) {
            body {
                padding: 1rem;
            }

            .login-card {
                padding: 1.8rem;
            }

            .login-header h2 {
                font-size: 1.5rem;
            }

            .logo-icon {
                width: 55px;
                height: 55px;
            }

            .logo-icon i {
                font-size: 2rem;
            }

            .login-options {
                flex-direction: column;
                align-items: flex-start;
            }

            .credential-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }
        }

        @media (max-width: 380px) {
            .login-card {
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fas fa-tiger"></i>
                </div>
                <h2>JAGWAR<span>HOST</span></h2>
                <p>Sign in to your account</p>
            </div>

            {% if error %}
            <div class="error-message">
                <i class="fas fa-exclamation-triangle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/login" class="login-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
            </form>

            <div class="divider">
                <div class="divider-line"></div>
                <span>Demo Access</span>
                <div class="divider-line"></div>
            </div>

            <div class="demo-credentials">
                <div class="demo-title">
                    <i class="fas fa-info-circle"></i>
                    <span>Demo Credentials (Admin Panel)</span>
                </div>
                <div class="credential-row">
                    <span class="credential-label">Username:</span>
                    <div>
                        <span class="credential-value">JAGWARGG</span>
                        <button class="copy-btn" onclick="copyToClipboard('JAGWARGG')"><i class="fas fa-copy"></i></button>
                    </div>
                </div>
                <div class="credential-row">
                    <span class="credential-label">Password:</span>
                    <div>
                        <span class="credential-value">JAGWAR12345</span>
                        <button class="copy-btn" onclick="copyToClipboard('JAGWAR12345')"><i class="fas fa-copy"></i></button>
                    </div>
                </div>
            </div>

            <div class="login-footer">
                <p>جميع الحقوق محفوظة JAGWAR 2026</p>
                <p>All rights reserved © 2026 JAGWAR HOST</p>
            </div>
        </div>
    </div>

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target.closest('.copy-btn');
                const originalIcon = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => {
                    btn.innerHTML = originalIcon;
                }, 1500);
            });
        }

        // Add animation to input fields
        document.querySelectorAll('.input-group input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.transform = 'scale(1.01)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
